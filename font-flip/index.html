<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Font Flip</title>
<style>
  :root {
    --ground: #F3F4F7;
    --bar: #FFFFFF;
    --ink: #1B2A4A;
    --muted: #5A6680;
    --rule: #DCE1E9;
    --on: #1B2A4A;
    --on-ink: #FFFFFF;
    --gold: #E8AA2E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font: 15px/1.4 Arial, Helvetica, sans-serif; display: flex; flex-direction: column; }
  header { background: var(--bar); border-bottom: 1px solid var(--rule); padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; }
  .name { font-weight: 700; font-size: 17px; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: var(--bar); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--on); border-color: var(--on); color: var(--on-ink); }
  .font button { font-size: 15px; font-weight: 700; padding: 8px 16px; }
  .font button[data-font="dm"] { font-family: 'DM Sans', Arial, sans-serif; }
  .font button[data-font="ubuntu"] { font-family: 'Ubuntu', Arial, sans-serif; font-weight: 500; }
  .font button[data-font="google"] { font-family: 'Google Sans Flex', Arial, sans-serif; }
  .font button .key { font-weight: 400; opacity: 0.6; margin-right: 6px; }
  .hint { color: var(--muted); font-size: 13px; margin-left: auto; }
  kbd { font: inherit; font-weight: 700; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bar); }
  .stage { position: relative; flex: 1; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #FFFFFF; }
  iframe.off { visibility: hidden; }
  @media (max-width: 1100px) { .hint { display: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,700&family=Ubuntu:wght@500&family=Google+Sans+Flex:wght@700&display=swap">
</head>
<body>
<header>
  <div class="name">Font Flip</div>
  <div class="group" id="pages" role="group" aria-label="Page"><span class="label">Page</span></div>
  <div class="group font" role="group" aria-label="Font">
    <span class="label">Font</span>
    <button type="button" data-font="dm" aria-pressed="true"><span class="key">1</span>DM Sans</button>
    <button type="button" data-font="arial" aria-pressed="false"><span class="key">2</span>Arial</button>
    <button type="button" data-font="ubuntu" aria-pressed="false"><span class="key">3</span>Ubuntu and Arial</button>
    <button type="button" data-font="google" aria-pressed="false"><span class="key">4</span>Google Sans Flex</button>
  </div>
  <div class="hint">Press <kbd>space</kbd> to flip at the same spot, or <kbd>1</kbd> to <kbd>4</kbd></div>
</header>
<main class="stage">
  <iframe id="dm" title="Page in DM Sans"></iframe>
  <iframe id="arial" class="off" title="Page in Arial"></iframe>
  <iframe id="ubuntu" class="off" title="Page in Ubuntu and Arial"></iframe>
  <iframe id="google" class="off" title="Page in Google Sans Flex"></iframe>
</main>
<script>
  var PAGES = [
    ['kalicube.com', ''],
    ['jasonbarnard.com', 'jasonbarnard/'],
    ['kalicube.pro', 'kalicubepro/'],
    ['Strategy Plus', 'strategy-plus/'],
    ['Application', 'apply/'],
    ['Name change page', 'landing/changed-my-name/'],
    ['Reputation page', 'landing/reputation/'],
    ['Compare: companies', 'compare/companies/'],
    ['Compare: entrepreneurs', 'compare/entrepreneurs/']
  ];
  var ORDER = ['dm', 'arial', 'ubuntu', 'google'];
  var FILES = { dm: 'index.html', arial: 'index-arial.html', ubuntu: 'index-ubuntu.html', google: 'index-google.html' };
  var frames = {};
  ORDER.forEach(function (k) { frames[k] = document.getElementById(k); });
  var shown = 'dm';
  var pageBar = document.getElementById('pages');

  function win(k) { try { return frames[k].contentWindow; } catch (e) { return null; } }

  function syncFrom(k) {
    var a = win(k);
    if (!a) return;
    var maxA = a.document.documentElement.scrollHeight - a.innerHeight;
    var ratio = maxA > 0 ? a.scrollY / maxA : 0;
    ORDER.forEach(function (o) {
      if (o === k) return;
      var b = win(o);
      if (!b) return;
      var maxB = b.document.documentElement.scrollHeight - b.innerHeight;
      b.scrollTo(0, Math.round(ratio * Math.max(maxB, 0)));
    });
  }

  function show(k) {
    if (k === shown) return;
    syncFrom(shown);
    ORDER.forEach(function (o) { frames[o].classList.toggle('off', o !== k); });
    shown = k;
    document.querySelectorAll('.font button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.font === k)); });
  }

  function onKey(e) {
    var tag = (e.target && e.target.tagName) || '';
    if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
    if (e.code === 'Space' && tag !== 'BUTTON') {
      e.preventDefault();
      show(ORDER[(ORDER.indexOf(shown) + 1) % ORDER.length]);
    } else if (/^[1-4]$/.test(e.key)) {
      show(ORDER[Number(e.key) - 1]);
    }
  }

  ORDER.forEach(function (k) {
    frames[k].addEventListener('load', function () {
      var w = win(k);
      if (!w) return;
      w.addEventListener('scroll', function () { if (k === shown) syncFrom(k); }, { passive: true });
      w.document.addEventListener('keydown', onKey);
    });
  });
  document.addEventListener('keydown', onKey);

  function load(i) {
    var path = '../' + PAGES[i][1];
    ORDER.forEach(function (k) { frames[k].src = path + FILES[k]; });
    pageBar.querySelectorAll('button').forEach(function (b, j) { b.setAttribute('aria-pressed', String(j === i)); });
    try { localStorage.setItem('font-flip-page', String(i)); } catch (e) {}
  }

  PAGES.forEach(function (p, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = p[0];
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { load(i); });
    pageBar.appendChild(b);
  });
  document.querySelectorAll('.font button').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.font); }); });

  var start = 0;
  try { start = Math.min(PAGES.length - 1, Math.max(0, parseInt(localStorage.getItem('font-flip-page') || '0', 10) || 0)); } catch (e) {}
  load(start);
</script>
</body>
</html>
