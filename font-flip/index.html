<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Font Flip</title>
<style>
  :root {
    --ground: #F3F4F7;
    --bar: #FFFFFF;
    --ink: #1B2A4A;
    --muted: #5A6680;
    --rule: #DCE1E9;
    --on: #1B2A4A;
    --on-ink: #FFFFFF;
    --gold: #E8AA2E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font: 15px/1.4 Arial, Helvetica, sans-serif; display: flex; flex-direction: column; }
  header { background: var(--bar); border-bottom: 1px solid var(--rule); padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; }
  .name { font-weight: 700; font-size: 17px; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: var(--bar); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--on); border-color: var(--on); color: var(--on-ink); }
  .font button { font-size: 15px; font-weight: 700; padding: 8px 18px; }
  .font button[data-font="dm"] { font-family: 'DM Sans', Arial, sans-serif; }
  .hint { color: var(--muted); font-size: 13px; margin-left: auto; }
  kbd { font: inherit; font-weight: 700; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bar); }
  .stage { position: relative; flex: 1; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #FFFFFF; }
  iframe.off { visibility: hidden; }
  @media (max-width: 760px) { .hint { display: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,700&display=swap">
</head>
<body>
<header>
  <div class="name">Font Flip</div>
  <div class="group" id="pages" role="group" aria-label="Page"><span class="label">Page</span></div>
  <div class="group font" role="group" aria-label="Font">
    <span class="label">Font</span>
    <button type="button" data-font="dm" aria-pressed="true">DM Sans</button>
    <button type="button" data-font="arial" aria-pressed="false">Arial</button>
  </div>
  <div class="hint">Press <kbd>space</kbd> to flip at the same spot</div>
</header>
<main class="stage">
  <iframe id="dm" title="Page in DM Sans"></iframe>
  <iframe id="arial" class="off" title="Page in Arial"></iframe>
</main>
<script>
  var PAGES = [
    ['kalicube.com', ''],
    ['jasonbarnard.com', 'jasonbarnard/'],
    ['kalicube.pro', 'kalicubepro/'],
    ['Strategy Plus', 'strategy-plus/'],
    ['Application', 'apply/'],
    ['Landing page', 'landing/changed-my-name/']
  ];
  var frames = { dm: document.getElementById('dm'), arial: document.getElementById('arial') };
  var shown = 'dm';
  var pageBar = document.getElementById('pages');

  function other(k) { return k === 'dm' ? 'arial' : 'dm'; }
  function win(k) { try { return frames[k].contentWindow; } catch (e) { return null; } }

  function syncFrom(k) {
    var a = win(k), b = win(other(k));
    if (!a || !b) return;
    var da = a.document.documentElement, db = b.document.documentElement;
    var maxA = da.scrollHeight - a.innerHeight, maxB = db.scrollHeight - b.innerHeight;
    var ratio = maxA > 0 ? a.scrollY / maxA : 0;
    b.scrollTo(0, Math.round(ratio * Math.max(maxB, 0)));
  }

  function show(k) {
    if (k === shown) return;
    syncFrom(shown);
    frames[k].classList.remove('off');
    frames[shown].classList.add('off');
    shown = k;
    document.querySelectorAll('.font button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.font === k)); });
  }

  function onKey(e) {
    if (e.code === 'Space' && !/INPUT|TEXTAREA|SELECT|BUTTON/.test((e.target && e.target.tagName) || '')) {
      e.preventDefault();
      show(other(shown));
    }
  }

  Object.keys(frames).forEach(function (k) {
    frames[k].addEventListener('load', function () {
      var w = win(k);
      if (!w) return;
      w.addEventListener('scroll', function () { if (k === shown) syncFrom(k); }, { passive: true });
      w.document.addEventListener('keydown', onKey);
    });
  });
  document.addEventListener('keydown', onKey);

  function load(i) {
    var path = '../' + PAGES[i][1];
    frames.dm.src = path + 'index.html';
    frames.arial.src = path + 'index-arial.html';
    pageBar.querySelectorAll('button').forEach(function (b, j) { b.setAttribute('aria-pressed', String(j === i)); });
    try { localStorage.setItem('font-flip-page', String(i)); } catch (e) {}
  }

  PAGES.forEach(function (p, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = p[0];
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { load(i); });
    pageBar.appendChild(b);
  });
  document.querySelectorAll('.font button').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.font); }); });

  var start = 0;
  try { start = Math.min(PAGES.length - 1, Math.max(0, parseInt(localStorage.getItem('font-flip-page') || '0', 10) || 0)); } catch (e) {}
  load(start);
</script>
</body>
</html>
